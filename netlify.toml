[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Routing lives in public/_redirects, which Netlify applies AFTER function
# resolution so it cannot shadow /.netlify/functions/*.
#
# There is intentionally no `/* -> /index.html` SPA fallback. This app has no
# client-side routing (every link is an in-page anchor), and a catch-all rewrite
# makes Netlify answer /api/* and /.netlify/functions/* with index.html, which
# silently breaks every data request.