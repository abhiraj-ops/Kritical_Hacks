[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Functions live in netlify/functions/api/* and are auto-served at /api/*,
# so no explicit /api redirect is needed — only the SPA fallback below.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200