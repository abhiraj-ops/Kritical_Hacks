[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: there is intentionally NO `/* -> /index.html` SPA fallback here.
#
# This app has no client-side routing — every link is an in-page anchor
# (#platform, #live-map, …) — so a catch-all rewrite would only serve HTML
# where the API should be. A `/*` rule makes Netlify answer /.netlify/functions/*
# and /api/* with index.html, which silently breaks every data request.
#
# Functions in netlify/functions/api/* are auto-served at /api/*.