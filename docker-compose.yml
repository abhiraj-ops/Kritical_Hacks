# ZeroDay-Guard AI — local stack
#
#   cp backend/.env.example backend/.env    # add your TINYFISH_API_KEY
#   docker compose up --build
#
# Backend  -> http://localhost:8000  (docs at /docs)
# Frontend -> http://localhost:3000

services:
  backend:
    build: ./backend
    container_name: zeroday-backend
    env_file:
      - ./backend/.env
    environment:
      # Allow the frontend container to reach the API.
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: zeroday-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
