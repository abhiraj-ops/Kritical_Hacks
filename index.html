<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0F1D" />
    <meta
      name="description"
      content="EcoPulse AI — real-time environmental and disaster intelligence powered by TinyFish live web agents."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>EcoPulse AI — Environmental & Disaster Intelligence</title>
    <script>
      // Applied before first paint so the theme never flashes.
      (function () {
        try {
          var valid = ['midnight', 'aurora', 'frost', 'graphite'];
          var stored = null;
          try {
            stored = window.localStorage.getItem('ecopulse-theme');
          } catch (e) {}
          var theme =
            stored && valid.indexOf(stored) !== -1
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'frost'
              : 'midnight';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
